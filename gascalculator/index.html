<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gas Fee Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="calculator">
    <div class="icon">⛽</div>

    <h1>Gas Fee Calculator</h1>
    <p class="subtitle">
      Estimate the Ethereum transaction fee.
    </p>

    <div class="form-group">
      <label for="gasLimit">Gas Limit</label>
      <input
        type="number"
        id="gasLimit"
        value="21000"
        min="1"
        placeholder="Enter gas limit"
      />
      <small>Standard transaction: 21,000 gas</small>
    </div>

    <div class="form-group">
      <label for="gasPrice">Gas Price</label>

      <div class="input-wrapper">
        <input
          type="number"
          id="gasPrice"
          value="20"
          min="0"
          step="0.01"
          placeholder="Enter gas price"
        />
        <span>Gwei</span>
      </div>
    </div>

    <div class="result">
      <p>Estimated Gas Fee</p>
      <h2 id="fee">0.00042 ETH</h2>
      <span id="feeGwei">420,000 Gwei</span>
    </div>

    <div class="info">
      <span>Gas Limit</span>
      <strong id="displayGasLimit">21,000</strong>

      <span>Gas Price</span>
      <strong id="displayGasPrice">20 Gwei</strong>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
