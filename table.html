<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mountains</title>

</head>
<body>
  <h1>Mountains</h1>
  <div id="mountains"></div>

  <script>
    const MOUNTAINS = [
      { name: "Kilimanjaro", height: 5895, place: "Tanzania" },
      { name: "Everest", height: 8848, place: "Nepal" },
      { name: "Mount Fuji", height: 3776, place: "Japan" },
      { name: "Vaalserberg", height: 323, place: "Netherlands" },
      { name: "Denali", height: 6168, place: "United States" },
      { name: "Popocatepetl", height: 5465, place: "Mexico" },
      { name: "Mont Blanc", height: 4808, place: "Italy/France" }
    ];

    function makeTable(data) {
      // Get column names from the first object
      const columns = Object.keys(data[0]);

      // Create the table element
      const table = document.createElement("table");

      // Create header row
      const headerRow = document.createElement("tr");
      columns.forEach(column => {   
        const headerCell = document.createElement("th");
        headerCell.textContent = column;
        headerRow.appendChild(headerCell);
      });
      table.appendChild(headerRow);

      // Create data rows
      data.forEach(rowData => {
        const row = document.createElement("tr");
        columns.forEach(column => {
          const cell = document.createElement("td");
          cell.textContent = rowData[column];
          if (typeof rowData[column] === "number") {
            cell.style.textAlign = "right";
          }
          row.appendChild(cell);
        });
        table.appendChild(row);
      });

      return table;
    }

    // Create the table and append to #mountains element
    const table = makeTable(MOUNTAINS);
    document.getElementById("mountains").appendChild(table);
  </script>
</body>
</html>
